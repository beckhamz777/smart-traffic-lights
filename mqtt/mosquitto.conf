# Eclipse Mosquitto Configuration for Smart Traffic Light System
# Standard MQTT (for Python / Node.js / Backend Control Clients)
listener 1883 0.0.0.0
protocol mqtt

# WebSockets (for Browser Web Apps via mqtt.js)
listener 9001 0.0.0.0
protocol websockets

# Allow local connections without username/password (for development & lab use)
allow_anonymous true

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

